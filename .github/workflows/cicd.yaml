---
name: CI/CD

# Builds and publishes the app image (ghcr.io/ibidani/ha-obsidian) as a single
# multi-arch manifest on push to `master`, then makes the package public.

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-lock:
    runs-on: ubuntu-latest
    name: Pin Docker Images
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: crazyrokr/gha-workflows/ha-addon-auto-locker@master
        with:
          lookup_sources: Dockerfile

  publish:
    name: Build & publish multi-arch image
    needs: auto-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get app info
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./obsidian"

      - name: Normalize version
        id: normalize
        run: |
          version="${{ steps.info.outputs.version }}"
          version="${version//\"/}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./obsidian
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ibidani/ha-obsidian:${{ steps.normalize.outputs.version }}
            ghcr.io/ibidani/ha-obsidian:latest
          labels: |
            io.hass.type=app
            io.hass.name=Obsidian
            io.hass.description=Runs Obsidian within your Home Assistant setup providing integration of live-features
            io.hass.url=https://github.com/ibidani/ha-obsidian/tree/master/obsidian
